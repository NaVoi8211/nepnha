# --- Tuning cho MacBook Pro 2019 Intel i5, 8GB RAM ---
# Giữ tổng RAM của Gradle daemon + Kotlin daemon dưới ~2.5GB để máy không swap.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:+UseSerialGC -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1024m

org.gradle.daemon=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# Single-module project => parallel không giúp gì, chỉ tốn RAM.
org.gradle.parallel=false

android.useAndroidX=true
kotlin.code.style=official
